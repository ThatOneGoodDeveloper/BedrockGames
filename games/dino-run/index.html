<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Run — Bedrock Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f0f0f5;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111119;border-bottom:1px solid #1f1f2e}
.back{color:#f0f0f5;text-decoration:none;font-weight:600}.back:hover{color:#9a80ff}
.score{font-weight:700;color:#9a80ff;font-size:1.1rem}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
canvas{border-radius:12px;border:1px solid #1f1f2e;cursor:pointer}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.85);z-index:10}
.overlay.hidden{display:none}
.box{background:#16161f;border:1px solid #1f1f2e;border-radius:16px;padding:40px;text-align:center;max-width:340px;width:90%}
.box h2{font-size:1.5rem;margin-bottom:8px}.box p{color:#9090a8;margin-bottom:24px}
.btn{padding:12px 32px;background:linear-gradient(135deg,#7c5cff,#5a3dd6);color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="top"><a class="back" href="../../">&#8592; Back</a><div class="score">Score: <span id="sc">0</span></div></div>
<div class="wrap"><canvas id="c"></canvas></div>
<div class="overlay" id="start"><div class="box"><h2>🦖 Dino Run</h2><p>Press Space, click, or tap to jump over obstacles!</p><button class="btn" id="playBtn">Play</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h2>Game Over</h2><p>Score: <span id="fs">0</span></p><button class="btn" id="retry">Play Again</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=700,H=300;c.width=W;c.height=H;
const GROUND=H-40,GRAVITY=0.6,JUMP=-12;
let dino,obstacles,score,speed,running,frame;

function init(){
  dino={x:60,y:GROUND,vy:0,w:30,h:40,jumping:false};
  obstacles=[];score=0;speed=5;frame=0;running=true;
  document.getElementById('sc').textContent=0;
  requestAnimationFrame(loop);
}
function jump(){if(!dino.jumping){dino.vy=JUMP;dino.jumping=true;}}
function loop(){
  if(!running)return;frame++;
  dino.vy+=GRAVITY;dino.y+=dino.vy;
  if(dino.y>=GROUND){dino.y=GROUND;dino.vy=0;dino.jumping=false;}
  if(frame%Math.max(40,90-Math.floor(score/5))===0){
    const h=20+Math.random()*30;const w=15+Math.random()*20;
    obstacles.push({x:W,y:GROUND-h+dino.h,w,h});
  }
  obstacles.forEach(o=>{o.x-=speed;});
  obstacles=obstacles.filter(o=>o.x+o.w>0);
  obstacles.forEach(o=>{
    if(!o.scored&&o.x+o.w<dino.x){o.scored=true;score++;document.getElementById('sc').textContent=score;speed=5+score*0.15;}
    if(dino.x+dino.w>o.x&&dino.x<o.x+o.w&&dino.y+dino.h>o.y&&dino.y<o.y+o.h){die();}
  });
  draw();requestAnimationFrame(loop);
}
function die(){running=false;document.getElementById('fs').textContent=score;document.getElementById('over').classList.remove('hidden');}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f1f2e';ctx.fillRect(0,GROUND+dino.h,W,H);
  // dino body
  ctx.fillStyle='#34d399';
  ctx.fillRect(dino.x,dino.y,dino.w,dino.h);
  ctx.fillRect(dino.x+dino.w-5,dino.y-12,14,16);
  ctx.fillStyle='#fff';ctx.fillRect(dino.x+dino.w+2,dino.y-10,5,5);
  ctx.fillStyle='#111';ctx.fillRect(dino.x+dino.w+4,dino.y-9,2,2);
  // legs
  ctx.fillStyle='#2ab783';
  if(frame%20<10){ctx.fillRect(dino.x+5,dino.y+dino.h,6,8);ctx.fillRect(dino.x+dino.w-11,dino.y+dino.h-2,6,6);}
  else{ctx.fillRect(dino.x+5,dino.y+dino.h-2,6,6);ctx.fillRect(dino.x+dino.w-11,dino.y+dino.h,6,8);}
  // obstacles
  ctx.fillStyle='#f87171';obstacles.forEach(o=>{ctx.fillRect(o.x,o.y,o.w,o.h);});
  // ground dots
  ctx.fillStyle='#2a2a3d';for(let i=0;i<W;i+=20)ctx.fillRect((i-frame*speed%20+W)%W,GROUND+dino.h+10,2,2);
}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump();}});
c.addEventListener('click',jump);c.addEventListener('touchstart',e=>{e.preventDefault();jump();});
document.getElementById('playBtn').onclick=()=>{document.getElementById('start').classList.add('hidden');init();};
document.getElementById('retry').onclick=()=>{document.getElementById('over').classList.add('hidden');init();};
</script>
</body>
</html>
