<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Bedrock Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f0f0f5;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111119;border-bottom:1px solid #1f1f2e;position:sticky;top:0;z-index:5}
.back{color:#f0f0f5;text-decoration:none;font-weight:600}.back:hover{color:#9a80ff}
.info{display:flex;gap:16px;font-weight:700;color:#9a80ff;font-size:.9rem}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.board{display:grid;gap:10px;width:min(90vw,420px)}
.card{aspect-ratio:1;border-radius:12px;background:#1e1e2a;border:2px solid #1f1f2e;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .3s ease;user-select:none}
.card.flipped,.card.matched{background:#16161f;border-color:#7c5cff;transform:rotateY(0)}
.card.matched{border-color:#34d399;cursor:default}
.card:not(.flipped):not(.matched):hover{border-color:#2a2a3d;background:#2a2a3d}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.85);z-index:10}
.overlay.hidden{display:none}
.box{background:#16161f;border:1px solid #1f1f2e;border-radius:16px;padding:40px;text-align:center;max-width:340px;width:90%}
.box h2{font-size:1.5rem;margin-bottom:8px}.box p{color:#9090a8;margin-bottom:24px}
.btn{padding:12px 32px;background:linear-gradient(135deg,#7c5cff,#5a3dd6);color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="top"><a class="back" href="../../">&#8592; Back</a><div class="info"><span>Moves: <span id="mv">0</span></span><span>Pairs: <span id="pr">0</span>/<span id="tp">8</span></span></div></div>
<div class="wrap"><div class="board" id="board"></div></div>
<div class="overlay hidden" id="over"><div class="box"><h2>🎉 You Win!</h2><p>Completed in <span id="fm">0</span> moves!</p><button class="btn" id="retry">Play Again</button></div></div>
<script>
const EMOJIS=['🎮','🎯','🏆','⚡','🔥','🎪','🎨','🎵','🌟','🎲','🧩','💎','🚀','🦄','🍕','🎸'];
const boardEl=document.getElementById('board');
let cards,flipped,matched,moves,pairs,locked,total;

function init(){
  total=8;pairs=0;moves=0;locked=false;flipped=[];matched=new Set();
  document.getElementById('mv').textContent=0;document.getElementById('pr').textContent=0;document.getElementById('tp').textContent=total;
  const pick=EMOJIS.slice(0,total);const deck=[...pick,...pick];
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  cards=deck;
  boardEl.style.gridTemplateColumns=`repeat(4,1fr)`;
  render();
}
function render(){
  boardEl.innerHTML='';
  cards.forEach((emoji,i)=>{
    const card=document.createElement('div');card.className='card';
    if(flipped.includes(i)||matched.has(i)){card.classList.add(matched.has(i)?'matched':'flipped');card.textContent=emoji;}
    card.addEventListener('click',()=>flip(i));
    boardEl.appendChild(card);
  });
}
function flip(i){
  if(locked||flipped.includes(i)||matched.has(i))return;
  flipped.push(i);render();
  if(flipped.length===2){
    moves++;document.getElementById('mv').textContent=moves;locked=true;
    const[a,b]=flipped;
    if(cards[a]===cards[b]){matched.add(a);matched.add(b);pairs++;document.getElementById('pr').textContent=pairs;flipped=[];locked=false;render();
      if(pairs===total){document.getElementById('fm').textContent=moves;document.getElementById('over').classList.remove('hidden');}
    }else{setTimeout(()=>{flipped=[];locked=false;render();},800);}
  }
}
document.getElementById('retry').onclick=()=>{document.getElementById('over').classList.add('hidden');init();};
init();
</script>
</body>
</html>
