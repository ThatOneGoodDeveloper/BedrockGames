<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Bedrock Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f0f0f5;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111119;border-bottom:1px solid #1f1f2e}
.back{display:flex;align-items:center;gap:8px;color:#f0f0f5;text-decoration:none;font-weight:600;font-size:.95rem}
.back:hover{color:#9a80ff}
.score{font-weight:700;color:#9a80ff;font-size:1.1rem}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#1f1f2e;padding:8px;border-radius:12px;width:min(90vw,380px);aspect-ratio:1}
.tile{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1rem,4vw,2rem);transition:all .12s ease;background:#16161f;color:#f0f0f5}
.t2{background:#2a2a3d;color:#f0f0f5}.t4{background:#3a3a5d;color:#f0f0f5}
.t8{background:#7c5cff;color:#fff}.t16{background:#6c4ce6;color:#fff}
.t32{background:#5a3dd6;color:#fff}.t64{background:#ff6b9d;color:#fff}
.t128{background:#f59e0b;color:#fff;font-size:clamp(.9rem,3.5vw,1.7rem)}.t256{background:#f97316;color:#fff;font-size:clamp(.9rem,3.5vw,1.7rem)}
.t512{background:#ef4444;color:#fff;font-size:clamp(.9rem,3.5vw,1.7rem)}.t1024{background:#34d399;color:#fff;font-size:clamp(.8rem,3vw,1.5rem)}
.t2048{background:linear-gradient(135deg,#7c5cff,#00d4ff);color:#fff;font-size:clamp(.8rem,3vw,1.5rem);animation:glow 1s ease infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px rgba(124,92,255,.4)}to{box-shadow:0 0 25px rgba(124,92,255,.7)}}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.85);z-index:10}
.overlay.hidden{display:none}
.box{background:#16161f;border:1px solid #1f1f2e;border-radius:16px;padding:40px;text-align:center;max-width:340px;width:90%}
.box h2{font-size:1.5rem;margin-bottom:8px}
.box p{color:#9090a8;margin-bottom:24px;font-size:.9rem}
.btn{display:inline-block;padding:12px 32px;background:linear-gradient(135deg,#7c5cff,#5a3dd6);color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,92,255,.3)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="../../">&#8592; Back</a>
  <div class="score">Score: <span id="sc">0</span></div>
</div>
<div class="wrap"><div class="board" id="board"></div></div>
<div class="overlay hidden" id="over">
  <div class="box">
    <h2 id="endTitle">Game Over</h2>
    <p>Score: <span id="fs">0</span></p>
    <button class="btn" id="retry">Play Again</button>
  </div>
</div>
<script>
let grid,score;const board=document.getElementById('board');
function init(){grid=Array.from({length:4},()=>Array(4).fill(0));score=0;upScore();addTile();addTile();render();}
function addTile(){const e=[];grid.forEach((r,i)=>r.forEach((v,j)=>{if(!v)e.push([i,j])}));if(!e.length)return;const[r,c]=e[Math.floor(Math.random()*e.length)];grid[r][c]=Math.random()<.9?2:4;}
function render(){board.innerHTML='';grid.flat().forEach(v=>{const d=document.createElement('div');d.className='tile'+(v?' t'+Math.min(v,2048):'');d.textContent=v||'';board.appendChild(d);});}
function upScore(){document.getElementById('sc').textContent=score;}
function slide(row){let a=row.filter(v=>v),i=0;while(i<a.length-1){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}i++}while(a.length<4)a.push(0);return a;}
function move(dir){let moved=false,g=grid.map(r=>[...r]);
  if(dir==='left')grid=grid.map(r=>slide(r));
  else if(dir==='right')grid=grid.map(r=>slide([...r].reverse()).reverse());
  else if(dir==='up'){for(let c=0;c<4;c++){let col=slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]);for(let r=0;r<4;r++)grid[r][c]=col[r];}}
  else{for(let c=0;c<4;c++){let col=slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]).reverse();for(let r=0;r<4;r++)grid[r][c]=col[r];}}
  grid.forEach((r,i)=>r.forEach((v,j)=>{if(v!==g[i][j])moved=true}));
  if(moved){addTile();upScore();render();checkEnd();}
}
function checkEnd(){if(grid.flat().includes(2048)){document.getElementById('endTitle').textContent='🎉 You Win!';document.getElementById('fs').textContent=score;document.getElementById('over').classList.remove('hidden');return;}
  if(grid.flat().includes(0))return;
  for(let r=0;r<4;r++)for(let c=0;c<3;c++){if(grid[r][c]===grid[r][c+1])return;if(grid[c][r]===grid[c+1][r])return;}
  document.getElementById('endTitle').textContent='Game Over';document.getElementById('fs').textContent=score;document.getElementById('over').classList.remove('hidden');
}
document.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(m[e.key]){e.preventDefault();move(m[e.key]);}});
let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?'right':'left'):move(dy>0?'down':'up');},{passive:true});
document.getElementById('retry').onclick=()=>{document.getElementById('over').classList.add('hidden');init();};
init();
</script>
</body>
</html>
