<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird — Bedrock Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#f0f0f5;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111119;border-bottom:1px solid #1f1f2e}
.back{color:#f0f0f5;text-decoration:none;font-weight:600}.back:hover{color:#9a80ff}
.score{font-weight:700;color:#9a80ff;font-size:1.1rem}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
canvas{border-radius:12px;border:1px solid #1f1f2e;cursor:pointer}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.85);z-index:10}
.overlay.hidden{display:none}
.box{background:#16161f;border:1px solid #1f1f2e;border-radius:16px;padding:40px;text-align:center;max-width:340px;width:90%}
.box h2{font-size:1.5rem;margin-bottom:8px}.box p{color:#9090a8;margin-bottom:24px}
.btn{padding:12px 32px;background:linear-gradient(135deg,#7c5cff,#5a3dd6);color:#fff;border:none;border-radius:999px;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="top"><a class="back" href="../../">&#8592; Back</a><div class="score">Score: <span id="sc">0</span></div></div>
<div class="wrap"><canvas id="c"></canvas></div>
<div class="overlay" id="start"><div class="box"><h2>🐦 Flappy Bird</h2><p>Click, tap, or press Space to flap!</p><button class="btn" id="playBtn">Play</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h2>Game Over</h2><p>Score: <span id="fs">0</span></p><button class="btn" id="retry">Play Again</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=640;c.width=W;c.height=H;
const GRAVITY=0.4,FLAP=-7,PIPE_W=52,GAP=160,PIPE_SPEED=2.5;
let bird,pipes,score,running,frame;

function init(){
  bird={x:80,y:H/2,vy:0,r:16};pipes=[];score=0;frame=0;running=true;
  document.getElementById('sc').textContent=0;
  requestAnimationFrame(loop);
}
function addPipe(){const top=60+Math.random()*(H-GAP-120);pipes.push({x:W,top,bot:top+GAP});}
function flap(){if(running)bird.vy=FLAP;}
function loop(){
  if(!running)return;
  frame++;if(frame%90===0)addPipe();
  bird.vy+=GRAVITY;bird.y+=bird.vy;
  pipes.forEach(p=>p.x-=PIPE_SPEED);
  pipes=pipes.filter(p=>p.x+PIPE_W>-10);
  pipes.forEach(p=>{
    if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;score++;document.getElementById('sc').textContent=score;}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W&&(bird.y-bird.r<p.top||bird.y+bird.r>p.bot))die();
  });
  if(bird.y+bird.r>H||bird.y-bird.r<0)die();
  draw();requestAnimationFrame(loop);
}
function die(){running=false;document.getElementById('fs').textContent=score;document.getElementById('over').classList.remove('hidden');}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  pipes.forEach(p=>{
    ctx.fillStyle='#34d399';
    ctx.fillRect(p.x,0,PIPE_W,p.top);ctx.fillRect(p.x,p.bot,PIPE_W,H-p.bot);
    ctx.fillStyle='#2ab783';
    ctx.fillRect(p.x-3,p.top-20,PIPE_W+6,20);ctx.fillRect(p.x-3,p.bot,PIPE_W+6,20);
  });
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.x+6,bird.y-4,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bird.x+8,bird.y-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(bird.x+bird.r,bird.y);ctx.lineTo(bird.x+bird.r+10,bird.y+3);ctx.lineTo(bird.x+bird.r,bird.y+6);ctx.fill();
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
c.addEventListener('click',flap);c.addEventListener('touchstart',e=>{e.preventDefault();flap();});
document.getElementById('playBtn').onclick=()=>{document.getElementById('start').classList.add('hidden');init();};
document.getElementById('retry').onclick=()=>{document.getElementById('over').classList.add('hidden');init();};
</script>
</body>
</html>
